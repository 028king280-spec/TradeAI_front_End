version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aivolve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aivolve_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aivolve_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivolve_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/aivolve_trading
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/aivolve_trading
      REDIS_URL: redis://redis:6379/0
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-upstox}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_CLIENT_ID: ${UPSTOX_CLIENT_ID:-}
      UPSTOX_CLIENT_SECRET: ${UPSTOX_CLIENT_SECRET:-}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-trinity-large-thinking}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,https://trade.aivolvetech.in"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivolve_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
